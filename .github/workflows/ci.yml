name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra compare

      - name: Infrastructure tests (must always be green)
        run: uv run pytest tests/

      - name: Course reference tests (course health, always green)
        run: LLMFS_TEST_REFERENCE=1 uv run pytest modules/
