# El juguete: GPT diminuto a nivel caracter sobre tiny-shakespeare.
#
# Para que sirve: validar el pipeline entero (datos -> modelo -> bucle -> muestreo) en
# menos de un minuto y en cualquier maquina, incluida CPU. Si algo esta roto, se ve aqui
# y no cuatro horas despues de lanzar la tirada de verdad.
#
# Con esta config el modelo tiene ~0,8M parametros y deberia bajar de perdida ~4,17
# (que es ln(65), el suelo de adivinar al azar) a ~1,5 en unos pocos miles de pasos.

name: tiny_char

# --------------------------------------------------------------------- modelo
vocab_size: 65            # los caracteres unicos de tiny-shakespeare
n_layers: 4
d_model: 128
n_heads: 4                # head_dim = 32
d_ff: 384                 # ceil_64(2/3 * 4 * 128) = ceil_64(341,3) = 384
context_length: 128
norm: rmsnorm
pos: rope
activation: swiglu
tie_embeddings: true
dropout: 0.1              # 1MB de texto: aqui SI hace falta regularizar
bias: false

# --------------------------------------------------------------------- datos
dataset: tinyshakespeare
tokenizer: char
data_dir: data
val_fraction: 0.05
num_workers: 2

# --------------------------------------------------------------------- entrenamiento
optimizer: adamw
lr: 3.0e-3                # un modelo pequenyo aguanta (y necesita) un lr mas alto
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
warmup_steps: 100
schedule: cosine
min_lr_ratio: 0.1
batch_size: 32
grad_accum: 1             # 32 x 1 x 128 = 4.096 tokens por paso
max_tokens: 12_000_000    # ~2.929 pasos
eval_interval: 250
eval_iters: 40
log_interval: 25
sample_interval: 500
seed: 1337
compile: false
amp: null

out_dir: checkpoints
