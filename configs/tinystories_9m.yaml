# The final model: ~8.93M parameters trained on TinyStories.
#
# Breakdown of the count (module 09 reproduces it and the test verifies it):
#   embeddings         4096 x 320                       = 1,310,720
#   attention / layer  4 x 320^2   (Wq, Wk, Wv, Wo)     =   409,600
#   swiglu    / layer  3 x 320 x 896 (gate, up, down)   =   860,160
#   rmsnorm   / layer  2 x 320                          =       640
#   ---------------------------------------------------------------
#   per layer                                           = 1,270,400
#   x 6 layers                                          = 7,622,400
#   final rmsnorm                                       =       320
#   lm_head            tied to the embeddings           =         0
#   ===============================================================
#   TOTAL                                               = 8,933,440
#
# Budget: 500M tokens / 7.62M non-embedding parameters = 65x. Chinchilla would say 20x.
# It is over-trained on purpose; module 11 explains why that is the right call here.

name: tinystories_9m

# --------------------------------------------------------------------- model
vocab_size: 4096          # our own BPE trained on TinyStories (module 02)
n_layers: 6
d_model: 320
n_heads: 8                # head_dim = 40
d_ff: 896                 # SwiGLU: ceil_64(2/3 * 4 * 320) = ceil_64(853.3) = 896
context_length: 512
norm: rmsnorm
pos: rope
activation: swiglu
tie_embeddings: true
dropout: 0.0              # with ~1 epoch over 500M tokens there is no need to regularize
bias: false
rope_theta: 10000.0

# --------------------------------------------------------------------- data
dataset: tinystories
tokenizer: bpe
data_dir: data
bpe_train_bytes: 150_000_000   # the merges are trained on a sample; see module 02
val_fraction: 0.005
num_workers: 4

# --------------------------------------------------------------------- training
optimizer: adamw
lr: 1.0e-3
betas: [0.9, 0.95]
weight_decay: 0.1         # not applied to norms or biases (module 10)
grad_clip: 1.0
warmup_steps: 500
schedule: cosine
min_lr_ratio: 0.1         # the cosine decays down to 10% of the lr, not to zero
batch_size: 48
grad_accum: 2             # 48 x 2 x 512 = 49,152 tokens per step
max_tokens: 500_000_000   # ~10,172 steps
eval_interval: 500
eval_iters: 100
log_interval: 10
sample_interval: 500      # text samples in the log to see how it learns to write
seed: 1337
compile: false            # Turing (sm_75): see llmfs/device.py
amp: null                 # null = the backend's policy (CUDA fp16 + GradScaler, MPS fp32)

out_dir: checkpoints
