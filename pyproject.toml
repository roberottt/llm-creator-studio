[project]
name = "llmfs"
version = "0.1.0"
description = "LLM desde cero: curso-repositorio para construir un GPT de ~9M de parametros en PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "datasets>=2.20",
    "matplotlib>=3.8",
    "pytest>=8.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "rich>=13.7",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
# Solo para las comparativas explicitas del modulo 02. El modelo NUNCA usa esto.
compare = ["tiktoken>=0.7"]
# Solo para el modulo 16 (servir el modelo).
serve = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
llmfs = "llmfs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmfs"]

[tool.pytest.ini_options]
testpaths = ["tests", "modulos"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --tb=short"
markers = [
    "slow: tarda mas de ~30s (excluir con -m 'not slow')",
    "cuda: requiere GPU NVIDIA",
    "network: requiere conexion a internet",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:torch",
]
